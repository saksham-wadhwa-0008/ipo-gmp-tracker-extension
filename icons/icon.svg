<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2.5" />

  <!-- Subtle grid lines -->
  <line x1="20" y1="44" x2="108" y2="44" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
  <line x1="20" y1="72" x2="108" y2="72" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
  <line x1="20" y1="100" x2="108" y2="100" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />

  <!-- Chart Area fill -->
  <path d="M 22 96 L 42 82 L 62 88 L 84 56 L 106 38 L 106 100 L 22 100 Z" fill="url(#chartGrad)" />

  <!-- Chart Trend Line -->
  <path d="M 22 96 L 42 82 L 62 88 L 84 56 L 106 38" fill="none" stroke="url(#lineGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Data point nodes -->
  <circle cx="22" cy="96" r="3.5" fill="#34D399" />
  <circle cx="42" cy="82" r="3.5" fill="#34D399" />
  <circle cx="62" cy="88" r="3.5" fill="#34D399" />
  <circle cx="84" cy="56" r="3.5" fill="#34D399" />
  <circle cx="106" cy="38" r="5" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5" />

  <!-- 15% Badge Pill in top-left -->
  <rect x="18" y="16" width="46" height="18" rx="9" fill="#10B981" />
  <text x="41" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">&gt;15%</text>

  <!-- IPO Text in top-right -->
  <text x="108" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#E2E8F0" text-anchor="end" letter-spacing="1">IPO</text>
</svg>
